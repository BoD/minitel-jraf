[versions]
kotlin = "2.4.21"
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
apollo = "5.2.0"
apollo-adapters = "0.8.0"
klibminitel = "1.4.1"
klibnanolog = "1.3.0"
logback = "1.6.5"
markdown = "0.7.17"
klibslack = "1.0.2"
jsoup = "1.23.2"
dockerJavaApplication = "10.0.0"
tapmoc = "0.5.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dockerJavaApplication = { id = "com.bmuschko.docker-java-application", version.ref = "dockerJavaApplication" }
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }

[libraries]
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-defaultHeaders = { group = "io.ktor", name = "ktor-server-default-headers", version.ref = "ktor" }
ktor-server-statusPages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
ktor-server-contentNegotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
klibminitel = { group = "org.jraf.klibminitel", name = "klibminitel", version.ref = "klibminitel" }
apollo-runtime = { group = "com.apollographql.apollo", name = "apollo-runtime", version.ref = "apollo" }
apollo-adapters-core = { group = "com.apollographql.adapters", name = "apollo-adapters-core", version.ref = "apollo-adapters" }
klibnanolog = { group = "org.jraf.klibnanolog", name = "klibnanolog", version.ref = "klibnanolog" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
markdown = { group = "org.jetbrains", name = "markdown", version.ref = "markdown" }
klibslack = { group = "org.jraf.klibslack", name = "klibslack", version.ref = "klibslack" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
